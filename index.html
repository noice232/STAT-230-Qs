{ch:"ch1",chLabel:"Ch 1: Counting & Probability",id:65,title:"Sampling Framework Classification",
text:`For each scenario, identify the correct counting model (ordered/unordered, with/without replacement) and compute:
<p>(a) A 3-character password from {A,B,C,D,E} where characters may repeat.</p>
<p>(b) A committee of 3 chosen from 8 people.</p>
<p>(c) Assign gold, silver, bronze medals to 3 of 8 runners.</p>
<p>(d) Distribute 10 identical candies among 4 children (no restrictions).</p>`,
tags:["counting","framework"],
sol:`The four fundamental counting models:

<p>(a) Ordered, with replacement: each position independently picks from 5. Answer: $5^3 = 125$.</p>

<p>(b) Unordered, without replacement: subsets of size 3 from 8. Answer: $\\binom{8}{3} = 56$.</p>

<p>(c) Ordered, without replacement: permutations of 3 from 8. Answer: $8^{(3)} = 8 \\times 7 \\times 6 = 336$.</p>

<p>(d) Identical objects into distinct bins (stars and bars): Answer: $\\binom{10+4-1}{4-1} = \\binom{13}{3} = 286$.</p>

Decision matrix: (1) Are the items distinguishable from each other? (2) Does order/position matter? This determines $n^k$ vs $n^{(k)}$ vs $\\binom{n}{k}$ vs stars-and-bars. Always classify before counting.`},

{ch:"ch1",chLabel:"Ch 1: Counting & Probability",id:66,title:"Drawing Digits in Increasing Order",
text:`Three digits are randomly selected from $\\{0, 1, 2, \\ldots, 9\\}$. Find the probability that the digits are drawn in strictly increasing order (1st $<$ 2nd $<$ 3rd) if:
<p>(a) draws are made without replacement.</p>
<p>(b) draws are made with replacement.</p>`,
tags:["counting","with vs without replacement"],trap:true,
sol:`(a) Without replacement: sample space has $10^{(3)} = 720$ ordered triples. Any 3-element subset produces $3! = 6$ orderings, exactly 1 increasing. There are $\\binom{10}{3} = 120$ such subsets.

$$P = \\frac{120}{720} = \\frac{1}{6}$$

By symmetry: given 3 distinct digits, each of $3!$ orderings is equally likely, so $P = 1/3! = 1/6$.

(b) With replacement: sample space has $10^3 = 1000$ outcomes. Strictly increasing forces distinct digits, so the favorable count is still $\\binom{10}{3} = 120$.

$$P = \\frac{120}{1000} = \\frac{3}{25}$$

TRAP: the numerator stays 120 in both parts (strictly increasing = distinct), but the denominator changes from 720 to 1000. With replacement adds repeated-digit outcomes to the sample space that can never be increasing, diluting the probability.`},

{ch:"ch1",chLabel:"Ch 1: Counting & Probability",id:67,title:"Passengers Getting Off at Stops",
text:`There are 5 stops remaining on a subway line and 4 passengers. Each passenger independently chooses a stop uniformly at random. What is the probability that exactly two passengers get off at one stop and exactly two at another (a "2-2 split")?`,
tags:["counting","multinomial partition"],
sol:`Total outcomes: $5^4 = 625$.

For the 2-2 split:

<p class="step">Choose which 2 of the 5 stops are used: $\\binom{5}{2} = 10$.</p>
<p class="step">Choose which 2 of the 4 passengers go to the first stop: $\\binom{4}{2} = 6$. The other 2 go to the second.</p>

Favorable: $10 \\times 6 = 60$.

$$P = \\frac{60}{625} = \\frac{12}{125} = 0.096$$

Common error: dividing by $2!$ because "the two stops seem symmetric." But they are distinguishable locations (stop 2 vs stop 4). The $\\binom{5}{2}$ already selects an unordered pair of stops.`},

{ch:"ch1",chLabel:"Ch 1: Counting & Probability",id:68,title:"Compound Constraints Without Replacement",
text:`A 4-digit number is formed by randomly selecting four digits from $\\{1, 2, 3, 4, 5, 6, 7\\}$ without replacement. Find the probability the number formed is an even number greater than 3000.`,
tags:["counting","overlapping constraints"],trap:true,
sol:`Sample space: $7^{(4)} = 840$.

Constraints: first digit $\\geq 3$ (for $> 3000$) AND last digit is even (2, 4, or 6).

TRAP: digits 4 and 6 satisfy both constraints, creating overlap. Case-split on the last digit:

Case A: Last digit $= 2$ (even but $< 3$, no conflict with first digit).
<p class="step">First digit: 5 choices from $\\{3,4,5,6,7\\}$. Middle two: $5 \\times 4 = 20$. Total: $100$.</p>

Case B: Last digit $= 4$ (even AND $\\geq 3$, competes with first digit).
<p class="step">First digit: 4 choices from $\\{3,5,6,7\\}$. Middle two: $5 \\times 4 = 20$. Total: $80$.</p>

Case C: Last digit $= 6$ (same overlap as Case B).
<p class="step">First digit: 4 choices from $\\{3,4,5,7\\}$. Total: $80$.</p>

Favorable: $100 + 80 + 80 = 260$.

$$P = \\frac{260}{840} = \\frac{13}{42}$$

Key technique: when two positional constraints share candidate values, case-split on the overlap rather than naively multiplying.`},

// ===== CH 2 TEXTBOOK ADDITIONS =====
{ch:"ch2",chLabel:"Ch 2: Conditional Probability",id:69,title:"Three-Event Inclusion-Exclusion: Exactly k",
text:`In a class of 200 students: 120 study math (M), 90 study physics (P), 70 study chemistry (C). Also, 50 study both M and P, 40 study both M and C, 30 study both P and C, and 20 study all three. Find:
<p>(a) $P$(student studies at least one subject)</p>
<p>(b) $P$(exactly two subjects)</p>
<p>(c) $P$(exactly one subject)</p>`,
tags:["inclusion-exclusion","exactly k events"],
sol:`(a) By Rule 4b:
$$P(M \\cup P \\cup C) = \\frac{120 + 90 + 70 - 50 - 40 - 30 + 20}{200} = \\frac{180}{200} = 0.9$$

For parts (b) and (c), decompose into Venn diagram regions.

"Exactly two" (in two events but not the third):
<p class="step">$|MP \\text{ only}| = 50 - 20 = 30$</p>
<p class="step">$|MC \\text{ only}| = 40 - 20 = 20$</p>
<p class="step">$|PC \\text{ only}| = 30 - 20 = 10$</p>

(b) $P(\\text{exactly two}) = \\frac{30+20+10}{200} = \\frac{60}{200} = 0.3$

"Exactly one" regions (subtract double-counted pairwise, add back triple):
<p class="step">$|M \\text{ only}| = 120 - 50 - 40 + 20 = 50$</p>
<p class="step">$|P \\text{ only}| = 90 - 50 - 30 + 20 = 30$</p>
<p class="step">$|C \\text{ only}| = 70 - 40 - 30 + 20 = 20$</p>

(c) $P(\\text{exactly one}) = \\frac{50+30+20}{200} = 0.5$

Consistency: $0.5 + 0.3 + 0.1 = 0.9 = P(\\text{at least one})$. \\checkmark`},

{ch:"ch2",chLabel:"Ch 2: Conditional Probability",id:70,title:"Best-of-Seven Series",
text:`Two teams play a best-of-seven series (first to 4 wins). Team A wins each game independently with probability 0.6. Find:
<p>(a) $P$(A wins the series in exactly 6 games)</p>
<p>(b) $P$(the series goes to 7 games)</p>
<p>(c) $P$(A wins the series)</p>`,
tags:["independence","Negative Binomial structure"],
sol:`(a) A wins in 6: exactly 3 A-wins in the first 5 games, then A wins game 6 (NB structure):

$$P = \\binom{5}{3}(0.6)^3(0.4)^2 \\times 0.6 = 10(0.6)^4(0.4)^2 = 10(0.1296)(0.16) = 0.20736$$

(b) Series reaches game 7: the score is 3-3 after 6 games:

$$P(\\text{7 games}) = \\binom{6}{3}(0.6)^3(0.4)^3 = 20(0.216)(0.064) = 0.27648$$

(c) Sum over all possible series lengths (A wins in 4, 5, 6, or 7):

<p class="step">In 4: $(0.6)^4 = 0.1296$</p>
<p class="step">In 5: $\\binom{4}{3}(0.6)^4(0.4) = 0.20736$</p>
<p class="step">In 6: $0.20736$ (part a)</p>
<p class="step">In 7: $0.27648 \\times 0.6 = 0.16589$</p>

$$P(\\text{A wins}) = 0.1296 + 0.2074 + 0.2074 + 0.1659 = 0.7103$$

A 60% per-game edge becomes a 71% series edge. The longer format amplifies the stronger team's advantage.`},

{ch:"ch2",chLabel:"Ch 2: Conditional Probability",id:71,title:"Bayesian Updating with Repeated Evidence",
text:`A box contains 4 coins: 3 fair ($P(H)=0.5$) and 1 biased ($P(H)=0.8$). A coin is picked at random and tossed 6 times, showing 5 heads. Find the probability the selected coin is the biased one.`,
tags:["Bayes","repeated trials","updating"],
sol:`Let $B$ = biased coin, $D$ = 5H in 6 tosses. Prior: $P(B) = 1/4$.

Likelihoods via Binomial PMF:
<p class="step">$P(D|B) = \\binom{6}{5}(0.8)^5(0.2)^1 = 6(0.32768)(0.2) = 0.39322$</p>
<p class="step">$P(D|B^c) = \\binom{6}{5}(0.5)^6 = 6/64 = 0.09375$</p>

Total probability:
$$P(D) = 0.39322(1/4) + 0.09375(3/4) = 0.09830 + 0.07031 = 0.16862$$

Bayes' theorem:
$$P(B|D) = \\frac{0.09830}{0.16862} \\approx 0.5830$$

The data (5/6 heads) shifts the posterior from 0.25 to 0.58. The likelihood ratio $P(D|B)/P(D|B^c) = 0.393/0.094 \\approx 4.19$ measures how much more strongly the biased coin explains the evidence. This is the core engine of Bayesian inference.`},

{ch:"ch2",chLabel:"Ch 2: Conditional Probability",id:72,title:"Conditional Independence in Classification",
text:`An email is spam with probability 0.5. Two features $A_1$, $A_2$ are checked. Given spam status, they are conditionally independent with:
<p>$P(A_1|\\text{Spam}) = 0.2$, $P(A_2|\\text{Spam}) = 0.1$</p>
<p>$P(A_1|\\text{Regular}) = 0.005$, $P(A_2|\\text{Regular}) = 0.004$</p>
<p>Find $P(\\text{Spam} \\mid A_1 \\cap A_2)$. Are $A_1$ and $A_2$ (unconditionally) independent?</p>`,
tags:["Bayes","conditional independence","Naive Bayes"],
sol:`Using conditional independence:

$P(A_1 A_2|\\text{Spam}) = (0.2)(0.1) = 0.02$

$P(A_1 A_2|\\text{Reg}) = (0.005)(0.004) = 0.00002$

Total probability: $P(A_1 A_2) = 0.02(0.5) + 0.00002(0.5) = 0.01001$

Bayes: $P(\\text{Spam}|A_1 A_2) = \\frac{0.01}{0.01001} \\approx 0.999$

Two features that are each individually somewhat indicative become overwhelming in combination. The likelihood ratio is $0.02/0.00002 = 1000$. This is the Naive Bayes classifier principle.

Are $A_1, A_2$ unconditionally independent? NO. We can check:
<p class="step">$P(A_1) = 0.2(0.5) + 0.005(0.5) = 0.1025$</p>
<p class="step">$P(A_2) = 0.1(0.5) + 0.004(0.5) = 0.052$</p>
<p class="step">$P(A_1)P(A_2) = 0.00533 \\neq P(A_1 A_2) = 0.01001$</p>

Conditional independence does NOT imply unconditional independence. The common cause (spam status) induces marginal dependence between the features.`},

// ===== CH 3 TEXTBOOK ADDITIONS =====
{ch:"ch3",chLabel:"Ch 3: Discrete Distributions",id:73,title:"Optimal Question Ordering",
text:`A contestant has two questions: A ($\\$100$ prize) and B ($\\$200$ prize). She chooses which to attempt first but must answer the first correctly before attempting the second. She knows A with probability 0.8 and B with probability 0.6, independently.
<p>(a) Which should she attempt first to maximize expected winnings?</p>
<p>(b) A $\\$50$ penalty now applies if the first question is wrong. Does the optimal strategy change?</p>`,
tags:["expected value","decision optimization"],
sol:`(a) Strategy "A first":
<p class="step">From A: $0.8 \\times 100 = 80$</p>
<p class="step">From B (requires A correct): $0.8 \\times 0.6 \\times 200 = 96$</p>
<p class="step">$E(\\text{A first}) = 80 + 96 = 176$</p>

Strategy "B first":
<p class="step">From B: $0.6 \\times 200 = 120$</p>
<p class="step">From A (requires B correct): $0.6 \\times 0.8 \\times 100 = 48$</p>
<p class="step">$E(\\text{B first}) = 120 + 48 = 168$</p>

Attempt A first ($176 > 168$). Intuition: start with the question you are more likely to know, since it "unlocks" the second question more often.

(b) With penalty:
<p class="step">A first: $176 - 50(0.2) = 166$</p>
<p class="step">B first: $168 - 50(0.4) = 148$</p>

Still A first ($166 > 148$). The penalty amplifies the advantage of starting with the higher-probability question.`},

{ch:"ch3",chLabel:"Ch 3: Discrete Distributions",id:74,title:"Geometric Distribution: Divisibility and Remainders",
text:`Let $X \\sim \\text{Geo}(p)$ where $X$ counts failures before the first success ($X \\in \\{0,1,2,\\ldots\\}$).
<p>(a) Find $P(X \\text{ is odd})$.</p>
<p>(b) Find $P(X \\text{ is divisible by 3})$.</p>
<p>(c) Find the PMF of $R = X \\pmod{4}$.</p>`,
tags:["Geometric","series manipulation"],
sol:`Let $q = 1 - p$.

(a) $$P(X \\text{ odd}) = \\sum_{k=0}^{\\infty} P(X=2k+1) = \\sum_{k=0}^{\\infty} q^{2k+1}p = pq\\sum_{k=0}^{\\infty}(q^2)^k = \\frac{pq}{1-q^2} = \\frac{pq}{p(1+q)} = \\frac{q}{1+q}$$

Sanity: if $p = 1/2$, then $P = (1/2)/(3/2) = 1/3$. The values 1,3,5,... have probabilities $1/4, 1/16, ...$, summing to $1/3$. \\checkmark

(b) $$P(X \\text{ div by 3}) = \\sum_{k=0}^{\\infty} q^{3k}p = \\frac{p}{1-q^3}$$

(c) For $r \\in \\{0,1,2,3\\}$:
$$P(R = r) = \\sum_{k=0}^{\\infty} q^{4k+r}p = \\frac{pq^r}{1-q^4}$$

Check: $\\sum_{r=0}^{3} \\frac{pq^r}{1-q^4} = \\frac{p(1+q+q^2+q^3)}{1-q^4} = \\frac{p}{1-q} = 1$. \\checkmark

Key technique: pull out $q^r$ (the non-periodic part), sum the periodic factor as a geometric series in $q^{\\text{period}}$.`},

{ch:"ch3",chLabel:"Ch 3: Discrete Distributions",id:75,title:"Game Winnings via Stopping Rule",
text:`A box contains 7 balls: 2 blue and 5 yellow. A player pays $\\$9$ entry and draws balls without replacement until the 2nd (last) blue ball is found. For every draw, the player receives $\\$2$. Find the PMF of the number of draws $X$, the expected net winnings, and $P$(player profits).`,
tags:["stopping rule","Negative Hypergeometric"],
sol:`$X$ = position of the 2nd blue ball in a random arrangement of 7. Range: $\\{2,3,4,5,6,7\\}$.

Think of $\\binom{7}{2} = 21$ equally likely positions for the 2 blue balls. For the last blue at position $x$, the other blue must be at some position $j < x$: there are $x-1$ choices.

$$P(X = x) = \\frac{x-1}{21} \\quad x = 2,3,4,5,6,7$$

Net winnings $W = 2X - 9$:

$$E(X) = \\frac{1}{21}\\sum_{x=2}^{7} x(x-1) = \\frac{2+6+12+20+30+42}{21} = \\frac{112}{21} = \\frac{16}{3}$$

$$E(W) = \\frac{32}{3} - 9 = \\frac{5}{3} \\approx \\$1.67$$

$$P(\\text{profit}) = P(W > 0) = P(X \\geq 5) = \\frac{4+5+6}{21} = \\frac{5}{7} \\approx 0.714$$

The game slightly favors the player, who profits about 71% of the time.`},

{ch:"ch3",chLabel:"Ch 3: Discrete Distributions",id:76,title:"MGF Inversion via Geometric Series",
text:`A random variable $Y$ has MGF $M_Y(t) = \\frac{2}{3 - e^t}$ for $t < \\ln 3$. Determine the PMF of $Y$ and identify the distribution.`,
tags:["MGF","geometric series","distribution identification"],
sol:`Rewrite to expose a geometric series:
$$M_Y(t) = \\frac{2}{3-e^t} = \\frac{2/3}{1 - e^t/3}$$

For $|e^t/3| < 1$ (i.e., $t < \\ln 3$), expand:
$$= \\frac{2}{3}\\sum_{y=0}^{\\infty}\\left(\\frac{e^t}{3}\\right)^y = \\sum_{y=0}^{\\infty} \\frac{2}{3^{y+1}} e^{ty}$$

Since $M_Y(t) = \\sum_y e^{ty} P(Y=y)$, match coefficients:

$$P(Y = y) = \\frac{2}{3^{y+1}} = \\frac{2}{3}\\left(\\frac{1}{3}\\right)^y \\quad y = 0,1,2,\\ldots$$

This is $Y \\sim \\text{Geo}(2/3)$.

Verification: $E(Y) = M'(0)$. $M'(t) = \\frac{2e^t}{(3-e^t)^2}$, so $E(Y) = 2/4 = 1/2 = (1-p)/p = (1/3)/(2/3)$. \\checkmark

Technique: expand the MGF as $\\sum c_y e^{ty}$ and read off $P(Y=y) = c_y$. This works by the uniqueness theorem (Theorem 3.4.1).`},

{ch:"ch3",chLabel:"Ch 3: Discrete Distributions",id:77,title:"Poisson Process: Conditions and Setup",
text:`For each scenario, determine whether a Poisson process model is appropriate and identify which of the three conditions (independence, individuality, homogeneity) may be violated:
<p>(a) Radioactive emissions: independent, occur singly, constant rate 5/sec.</p>
<p>(b) Store customers arrive in groups of 2-3 during a sale, groups at constant rate.</p>
<p>(c) Earthquakes at rate 2/year, but a major quake triggers aftershocks.</p>
<p>(d) For (a), find $P(X \\geq 3)$ where $X$ counts emissions in 2 seconds.</p>`,
tags:["Poisson process","model assumptions"],
sol:`Three conditions: (1) Independence (non-overlapping intervals), (2) Individuality (events occur singly), (3) Homogeneity (constant rate).

<p>(a) YES: all three conditions satisfied. $X(t) \\sim \\text{Poi}(5t)$.</p>

<p>(b) NO: individuality violated. Customers arrive in clusters of 2-3, not singly. The number of groups could follow a Poisson process, but individual arrivals do not.</p>

<p>(c) NO: independence violated. A major quake triggers aftershocks, so an event in one interval increases the rate in nearby intervals.</p>

(d) $X \\sim \\text{Poi}(5 \\times 2) = \\text{Poi}(10)$.

$$P(X \\geq 3) = 1 - P(X=0) - P(X=1) - P(X=2) = 1 - e^{-10}\\left(1 + 10 + 50\\right) = 1 - 61e^{-10} \\approx 0.9972$$

With rate 10 in 2 seconds, fewer than 3 events is extremely rare.`},

{ch:"ch3",chLabel:"Ch 3: Discrete Distributions",id:78,title:"Cumulant Generating Function Shortcut",
text:`Let $M(t)$ be the MGF of $X$. Define the cumulant generating function $C(t) = \\ln M(t)$.
<p>(a) Show that $C'(0) = E(X)$ and $C''(0) = \\text{Var}(X)$.</p>
<p>(b) Use this to find $E(X)$ and $\\text{Var}(X)$ for $X \\sim \\text{Poi}(\\mu)$, whose MGF is $M(t) = e^{\\mu(e^t - 1)}$.</p>`,
tags:["MGF","cumulant","variance shortcut"],
sol:`(a) Differentiate $C(t) = \\ln M(t)$:

$$C'(t) = \\frac{M'(t)}{M(t)} \\implies C'(0) = \\frac{M'(0)}{M(0)} = \\frac{E(X)}{1} = E(X)$$

since $M(0) = 1$ always.

$$C''(t) = \\frac{M''(t)M(t) - [M'(t)]^2}{[M(t)]^2}$$

$$C''(0) = M''(0) - [M'(0)]^2 = E(X^2) - [E(X)]^2 = \\text{Var}(X)$$

(b) For Poi$(\\mu)$: $C(t) = \\ln(e^{\\mu(e^t-1)}) = \\mu(e^t - 1)$.

$$C'(t) = \\mu e^t \\implies C'(0) = \\mu = E(X)$$
$$C''(t) = \\mu e^t \\implies C''(0) = \\mu = \\text{Var}(X)$$

The CGF gives both mean and variance in two lines, bypassing the tedious product/chain rule needed to differentiate $M(t)$ directly. This shortcut is especially powerful for distributions whose MGF has a complex form but whose log simplifies nicely (Poisson, Binomial, Normal).`},

// ===================== PHASE 2: ALL REMAINING GAPS =====================

// ===== CH 1 PHASE 2 =====
{ch:"ch1",chLabel:"Ch 1: Counting & Probability",id:79,title:"Odds and Probability Conversion",
text:`A weather model gives 3:2 odds in favor of rain tomorrow.
<p>(a) What is $P(\\text{rain})$?</p>
<p>(b) If $P(\\text{snow}) = 0.1$, what are the odds against snow?</p>
<p>(c) A bet pays 5:1 against. If the true probability of winning is 0.25, is this a good bet?</p>`,
tags:["odds","probability conversion"],
sol:`(a) Odds $a:b$ in favor means $P = a/(a+b)$.

$$P(\\text{rain}) = \\frac{3}{3+2} = \\frac{3}{5} = 0.6$$

(b) Odds against = $P(\\text{no snow}) : P(\\text{snow}) = 0.9 : 0.1 = 9:1$ against snow.

(c) Odds 5:1 against means the implied breakeven probability is $1/(5+1) = 1/6 \\approx 0.167$. Your true probability of winning is 0.25, which exceeds the breakeven, so the expected payout is positive. Specifically: $E = 0.25(5) - 0.75(1) = 1.25 - 0.75 = 0.50 > 0$. Yes, this is a favorable bet.

Conversion formulas: odds $a:b$ in favor $\\iff P = a/(a+b) \\iff$ odds $= P/(1-P)$.`},

{ch:"ch1",chLabel:"Ch 1: Counting & Probability",id:80,title:"Stirling's Formula for Large Factorials",
text:`Stirling's approximation: $n! \\approx \\sqrt{2\\pi n}\\,(n/e)^n$.
<p>(a) Use it to approximate $\\binom{100}{50}$.</p>
<p>(b) Show that $\\binom{2n}{n} \\approx \\frac{4^n}{\\sqrt{\\pi n}}$ for large $n$.</p>`,
tags:["Stirling","large factorials","approximation"],
sol:`(a) $\\binom{100}{50} = \\frac{100!}{(50!)^2}$.

Apply Stirling to each factorial:

$$\\frac{\\sqrt{2\\pi(100)}(100/e)^{100}}{[\\sqrt{2\\pi(50)}(50/e)^{50}]^2} = \\frac{\\sqrt{200\\pi} \\cdot 100^{100}/e^{100}}{2\\pi(50) \\cdot 50^{100}/e^{100}}$$

$$= \\frac{\\sqrt{200\\pi} \\cdot 2^{100}}{100\\pi} = \\frac{2^{100}}{\\sqrt{50\\pi}} \\approx \\frac{1.268 \\times 10^{30}}{12.533} \\approx 1.012 \\times 10^{29}$$

Exact value: $\\binom{100}{50} \\approx 1.009 \\times 10^{29}$. Error $< 1\\%$.

(b) Same approach with general $n$:

$$\\binom{2n}{n} = \\frac{(2n)!}{(n!)^2} \\approx \\frac{\\sqrt{4\\pi n}(2n/e)^{2n}}{2\\pi n(n/e)^{2n}} = \\frac{\\sqrt{4\\pi n} \\cdot 2^{2n}}{2\\pi n} = \\frac{4^n}{\\sqrt{\\pi n}}$$

This shows that the central binomial coefficient grows exponentially as $4^n$ but is dampened by $1/\\sqrt{\\pi n}$.`},

// ===== CH 2 PHASE 2 =====
{ch:"ch2",chLabel:"Ch 2: Conditional Probability",id:81,title:"Randomized Response Technique",
text:`To estimate what fraction of students have cheated on an exam, a researcher uses the randomized response method: each student secretly flips a coin. If heads, answer "yes" regardless of truth. If tails, answer truthfully. In a survey of 400 students, 280 answered "yes."
<p>(a) Set up the probability model and estimate the true proportion $p$ of cheaters.</p>
<p>(b) Why does this protect privacy?</p>`,
tags:["conditional probability","randomized response"],
sol:`(a) Let $Y$ = "yes" answer. By the law of total probability:

$$P(Y) = P(Y|H)P(H) + P(Y|T)P(T) = 1 \\cdot 0.5 + p \\cdot 0.5 = 0.5 + 0.5p$$

We observe $\\hat{P}(Y) = 280/400 = 0.70$.

$$0.70 = 0.5 + 0.5p \\implies p = \\frac{0.70 - 0.50}{0.50} = 0.40$$

An estimated 40% of students have cheated.

(b) Privacy protection: even if a student answers "yes," the researcher cannot tell whether this is because the coin landed heads (forced "yes") or because the student is actually a cheater. Any individual "yes" has plausible deniability. The coin flip injects calibrated noise that masks individual truth while allowing population-level estimation.

This is an early form of differential privacy. The key insight is that the noise mechanism ($P(\\text{coin}) = 0.5$) is known, so the researcher can "subtract off" its effect from the aggregate.`},

// ===== CH 3 PHASE 2 =====
{ch:"ch3",chLabel:"Ch 3: Discrete Distributions",id:82,title:"Discrete CDF: Step Function and PMF Recovery",
text:`The CDF of a discrete random variable $X$ is:
$$F(x) = \\begin{cases} 0 & x < 1 \\\\ 0.2 & 1 \\leq x < 3 \\\\ 0.5 & 3 \\leq x < 5 \\\\ 0.85 & 5 \\leq x < 7 \\\\ 1.0 & x \\geq 7 \\end{cases}$$
<p>(a) Find the PMF of $X$.</p>
<p>(b) Find $P(2 < X \\leq 5)$ and $P(X > 3)$.</p>`,
tags:["CDF","step function","PMF recovery"],trap:true,
sol:`(a) For a discrete CDF, the probability mass at each jump point equals the jump size:

<p class="step">$P(X = 1) = F(1) - F(1^-) = 0.2 - 0 = 0.2$</p>
<p class="step">$P(X = 3) = F(3) - F(3^-) = 0.5 - 0.2 = 0.3$</p>
<p class="step">$P(X = 5) = F(5) - F(5^-) = 0.85 - 0.5 = 0.35$</p>
<p class="step">$P(X = 7) = F(7) - F(7^-) = 1.0 - 0.85 = 0.15$</p>

Check: $0.2 + 0.3 + 0.35 + 0.15 = 1$. &#10003;

(b) TRAP: careful with inequality directions!

$P(2 < X \\leq 5) = F(5) - F(2) = 0.85 - 0.2 = 0.65$

Note $F(2) = 0.2$ (not a jump point, so $F(2) = F(1) = 0.2$).

$P(X > 3) = 1 - P(X \\leq 3) = 1 - F(3) = 1 - 0.5 = 0.5$

TRAP: $P(X > 3) \\neq P(X \\geq 3)$ for discrete RVs. $P(X \\geq 3) = 1 - F(3^-) = 1 - 0.2 = 0.8$. The difference is $P(X = 3) = 0.3$.`},

{ch:"ch3",chLabel:"Ch 3: Discrete Distributions",id:83,title:"Memoryless Property of the Geometric Distribution",
text:`Let $X \\sim \\text{Geo}(p)$ (counting trials until first success, $X \\in \\{1,2,3,\\ldots\\}$).
<p>(a) Prove $P(X > s + t \\mid X > s) = P(X > t)$ for non-negative integers $s, t$.</p>
<p>(b) A die is rolled repeatedly. Given that no 6 has appeared in the first 10 rolls, what is $P(\\text{first 6 on roll 15 or later})$?</p>`,
tags:["Geometric","memoryless property"],
sol:`(a) $P(X > k) = (1-p)^k$ for the geometric (probability of $k$ consecutive failures).

$$P(X > s+t \\mid X > s) = \\frac{P(X > s+t)}{P(X > s)} = \\frac{(1-p)^{s+t}}{(1-p)^s} = (1-p)^t = P(X > t)$$

The process "resets" at any point, regardless of how many failures have occurred. This is the discrete analog of the Exponential's memoryless property.

(b) First 6 is Geo($1/6$). Given no 6 in 10 rolls (i.e., $X > 10$), by memorylessness:

$$P(X \\geq 15 \\mid X > 10) = P(X > 14 \\mid X > 10) = P(X > 4) = (5/6)^4 = \\frac{625}{1296} \\approx 0.482$$

This is the same as asking $P(X \\geq 5)$ for a fresh sequence. The "cold streak" is irrelevant.`},

// ===== CH 4 PHASE 2 =====
{ch:"ch4",chLabel:"Ch 4: Multivariate Distributions",id:84,title:"Variance of General Linear Combinations",
text:`$X_1, X_2, X_3$ have variances $\\text{Var}(X_1) = 4$, $\\text{Var}(X_2) = 9$, $\\text{Var}(X_3) = 16$, and covariances $\\text{Cov}(X_1, X_2) = 2$, $\\text{Cov}(X_1, X_3) = -3$, $\\text{Cov}(X_2, X_3) = 1$.
<p>Find $\\text{Var}(2X_1 - X_2 + 3X_3)$.</p>`,
tags:["variance","linear combination","covariance"],trap:true,
sol:`For $W = a_1X_1 + a_2X_2 + a_3X_3$ with $a_1 = 2, a_2 = -1, a_3 = 3$:

$$\\text{Var}(W) = \\sum_i a_i^2 \\text{Var}(X_i) + 2\\sum_{i<j} a_i a_j \\text{Cov}(X_i, X_j)$$

Variance terms:
<p class="step">$4(4) + 1(9) + 9(16) = 16 + 9 + 144 = 169$</p>

Covariance cross-terms:
<p class="step">$2(2)(-1)(2) = -8$</p>
<p class="step">$2(2)(3)(-3) = -36$</p>
<p class="step">$2(-1)(3)(1) = -6$</p>

$$\\text{Var}(W) = 169 + (-8) + (-36) + (-6) = 119$$

TRAP: the formula has $2 \\sum a_i a_j \\text{Cov}$. Forgetting the factor of 2, or the signs from the coefficients $a_i$, are common errors. When $a_2 = -1$, the cross-term with $X_2$ flips sign. If all variables were independent (all covariances zero), we would get 169, and the negative covariance terms reduce this.`},

{ch:"ch4",chLabel:"Ch 4: Multivariate Distributions",id:85,title:"Indicator Variables: Cutting a Stick",
text:`A stick of length 1 is cut at 2 points chosen independently and uniformly on $[0,1]$. Let $X$ = number of pieces with length $> 1/3$. Find $E(X)$.`,
tags:["indicator variables","dependent","stick cutting"],
sol:`Write $X = I_1 + I_2 + I_3$ where $I_k = 1$ if piece $k$ has length $> 1/3$.

By symmetry, each piece has the same distribution, so $P(I_k = 1)$ is the same for all $k$.

To find $P(\\text{piece } k > 1/3)$: Consider the two cut points $U_1, U_2$ on $[0,1]$. The three piece lengths sum to 1. By symmetry, each piece has mean $1/3$.

For piece 1 (leftmost), its length is $\\min(U_1, U_2)$. We need $P(\\min(U_1,U_2) > 1/3) = P(U_1 > 1/3, U_2 > 1/3) = (2/3)^2 = 4/9$.

By symmetry, each piece has $P(\\text{length} > 1/3) = 4/9$.

$$E(X) = 3 \\times \\frac{4}{9} = \\frac{4}{3} \\approx 1.333$$

Note: the indicators $I_1, I_2, I_3$ are NOT independent (if two pieces are long, the third must be short). But linearity of expectation does NOT require independence: $E(X) = E(I_1) + E(I_2) + E(I_3)$ always holds.`},

{ch:"ch4",chLabel:"Ch 4: Multivariate Distributions",id:86,title:"Markov's Inequality: Direct Application",
text:`An insurance company's daily claims $X$ have $E(X) = \\$50{,}000$.
<p>(a) Using only this information, bound $P(X \\geq \\$200{,}000)$.</p>
<p>(b) If also $\\text{Var}(X) = (\\$30{,}000)^2$, bound $P(X \\geq \\$200{,}000)$ using Chebyshev.</p>
<p>(c) Compare the two bounds and discuss when each is useful.</p>`,
tags:["Markov","Chebyshev","comparison"],
sol:`(a) Markov's inequality (requires only $X \\geq 0$ and $E(X)$):

$$P(X \\geq 200{,}000) \\leq \\frac{E(X)}{200{,}000} = \\frac{50{,}000}{200{,}000} = 0.25$$

(b) Chebyshev (requires $E(X)$ and $\\text{Var}(X)$):

$$P(X \\geq 200{,}000) \\leq P(|X - 50{,}000| \\geq 150{,}000) \\leq \\frac{(30{,}000)^2}{(150{,}000)^2} = \\frac{1}{25} = 0.04$$

(c) Chebyshev gives a much tighter bound (4% vs 25%) because it uses the additional variance information. Markov is a one-moment bound (uses only $E(X)$), Chebyshev is a two-moment bound (uses $E(X)$ and $\\text{Var}(X)$).

Markov is useful when you know only the mean, or when the variable is clearly non-negative. Chebyshev sharpens the bound whenever you also know the variance. Neither requires knowledge of the distribution's shape.`},

{ch:"ch4",chLabel:"Ch 4: Multivariate Distributions",id:87,title:"Finding a Parameter for Zero Correlation",
text:`Let $(X, Y)$ have joint pdf $f(x,y) = cx^2y$ for $0 \\leq x \\leq 1$, $0 \\leq y \\leq 1$. Define $W = X + cY$ for some constant $c$.
<p>(a) Are $X$ and $Y$ independent?</p>
<p>(b) Find $\\text{Cov}(X, W)$ and determine the value of $c$ that makes $X$ and $W$ uncorrelated.</p>`,
tags:["correlation","parameter tuning","independence"],
sol:`(a) Check if $f(x,y) = f_X(x) \\cdot f_Y(y)$:

$f_X(x) = \\int_0^1 cx^2y\\,dy = cx^2/2$. Normalize: $\\int_0^1 cx^2/2\\,dx = c/6 = 1$, so $c = 6$.

$f_X(x) = 3x^2$, $f_Y(y) = \\int_0^1 6x^2y\\,dx = 2y$.

$f_X(x) \\cdot f_Y(y) = 6x^2y = f(x,y)$. YES, $X$ and $Y$ are independent.

(b) Since $X \\perp Y$: $\\text{Cov}(X,Y) = 0$.

$\\text{Cov}(X, W) = \\text{Cov}(X, X + cY) = \\text{Var}(X) + c\\,\\text{Cov}(X,Y) = \\text{Var}(X) + 0 = \\text{Var}(X)$

$E(X) = \\int_0^1 3x^3\\,dx = 3/4$. $E(X^2) = \\int_0^1 3x^4\\,dx = 3/5$.
$\\text{Var}(X) = 3/5 - 9/16 = 48/80 - 45/80 = 3/80$.

Since $\\text{Cov}(X, W) = 3/80 > 0$ for ALL values of $c$, there is no value of $c$ that makes $X$ and $W$ uncorrelated.

This is because $W$ always contains $X$ as a component, and $\\text{Var}(X) > 0$, so $X$ and $W = X + cY$ always share positive covariance through the $X$ term. The $cY$ part is irrelevant since $X \\perp Y$.`},

{ch:"ch4",chLabel:"Ch 4: Multivariate Distributions",id:88,title:"Pentapolis Bridge Problem",
text:`Five cities form a network. Each pair of cities is independently connected by a direct road with probability $p = 0.6$. Let $X$ be the number of roads. Given that City A has exactly 2 roads, find the expected total number of roads in the network.`,
tags:["conditional expectation","indicator decomposition"],
sol:`There are $\\binom{5}{2} = 10$ possible roads total. Without conditioning, each exists independently with $P = 0.6$, so $X \\sim \\text{Bin}(10, 0.6)$.

Partition the 10 roads into two groups:
<p class="step">Group 1: roads touching City A. There are 4 such roads (A-B, A-C, A-D, A-E).</p>
<p class="step">Group 2: roads NOT touching City A. There are $\\binom{4}{2} = 6$ such roads.</p>

These groups are independent (each road exists independently).

Given City A has exactly 2 roads: Group 1 contributes 2 roads. Group 2 is unaffected by this conditioning (independence).

$E(\\text{Group 2 roads}) = 6 \\times 0.6 = 3.6$

$E(X \\mid \\text{City A has 2 roads}) = 2 + 3.6 = 5.6$

Compare: $E(X) = 10(0.6) = 6$. Conditioning on City A having fewer roads than average (2 vs expected 2.4) pulls the total down from 6 to 5.6, but only by the deficit in City A's own roads. The rest of the network is unaffected.`},

// ===== CH 5 PHASE 2 =====
{ch:"ch5",chLabel:"Ch 5: Continuous Distributions",id:89,title:"Probability Integral Transform (Simulation)",
text:`Let $X$ have CDF $F(x) = 1 - e^{-x^2}$ for $x \\geq 0$.
<p>(a) If $U \\sim U(0,1)$, find a formula for generating $X$ from $U$ (i.e., find $F^{-1}(u)$).</p>
<p>(b) State the general principle: why does $F^{-1}(U) \\sim X$ work?</p>`,
tags:["probability integral transform","simulation","inverse CDF"],
sol:`(a) Set $u = F(x) = 1 - e^{-x^2}$ and solve for $x$:

$$e^{-x^2} = 1 - u \\implies -x^2 = \\ln(1-u) \\implies x = \\sqrt{-\\ln(1-u)}$$

So $X = F^{-1}(U) = \\sqrt{-\\ln(1-U)}$ for $U \\sim U(0,1)$.

(Since $1-U \\sim U(0,1)$ as well, we can simplify: $X = \\sqrt{-\\ln U}$.)

(b) The Probability Integral Transform (Theorem 5.4.1): if $F$ is a continuous CDF and $U \\sim U(0,1)$, then $X = F^{-1}(U)$ has CDF $F$.

Proof: $P(F^{-1}(U) \\leq x) = P(U \\leq F(x)) = F(x)$, since $U \\sim U(0,1)$ gives $P(U \\leq t) = t$.

This is the foundation of computer simulation: generate $U$ from a random number generator, then apply $F^{-1}$ to get a sample from any desired distribution. Q43 showed the special case where $-2\\ln(U) \\sim \\text{Exp}(1/2)$.`},

{ch:"ch5",chLabel:"Ch 5: Continuous Distributions",id:90,title:"Monotonic Transformation Formula",
text:`Let $X \\sim \\text{Exp}(1)$. Use the change-of-variable formula to find the pdf of $Y = \\sqrt{X}$.`,
tags:["transformation","Jacobian","change of variable"],trap:true,
sol:`Since $g(x) = \\sqrt{x}$ is strictly increasing on $(0, \\infty)$, the change-of-variable formula (Theorem 5.2.1) gives:

$$f_Y(y) = f_X(h(y)) \\cdot |h'(y)|$$

where $h = g^{-1}$ (the inverse), so $x = h(y) = y^2$.

$h'(y) = 2y$, and $f_X(x) = e^{-x}$ for $x > 0$.

$$f_Y(y) = e^{-y^2} \\cdot 2y = 2ye^{-y^2} \\quad \\text{for } y > 0$$

TRAP: do NOT forget the $|h'(y)|$ Jacobian term. Without it you get $e^{-y^2}$ (wrong). The Jacobian accounts for the "stretching" of the transformation.

Check: $\\int_0^{\\infty} 2ye^{-y^2}\\,dy = [-e^{-y^2}]_0^{\\infty} = 0 - (-1) = 1$. &#10003;

This is actually a Rayleigh-like distribution. Compare with the CDF technique (Q43): both methods give the same answer, but the formula is faster when the transformation is monotonic.`},

{ch:"ch5",chLabel:"Ch 5: Continuous Distributions",id:91,title:"CLT: Sample Size Determination",
text:`A machine fills bottles with a mean of 500 ml and standard deviation of 6 ml. How large a sample $n$ must be taken so that $P(|\\bar{X} - 500| < 1) \\geq 0.99$?`,
tags:["CLT","sample size","backward"],
sol:`By CLT: $\\bar{X} \\approx N(500, 36/n)$, so $\\frac{\\bar{X} - 500}{6/\\sqrt{n}} \\approx Z$.

$$P(|\\bar{X} - 500| < 1) = P\\left(|Z| < \\frac{\\sqrt{n}}{6}\\right) \\geq 0.99$$

For $P(|Z| < z_{0.005}) = 0.99$: $z_{0.005} = 2.576$ (from $\\Phi(2.576) = 0.995$).

$$\\frac{\\sqrt{n}}{6} \\geq 2.576 \\implies \\sqrt{n} \\geq 15.456 \\implies n \\geq 238.9$$

Round up: $n \\geq 239$.

Compare with Chebyshev approach (Q35-style): Chebyshev gives $\\frac{36}{n(1)^2} \\leq 0.01$, so $n \\geq 3600$. CLT needs only 239 samples because it uses the Normal shape, while Chebyshev makes no distributional assumption and pays a steep price for generality.`},

{ch:"ch5",chLabel:"Ch 5: Continuous Distributions",id:92,title:"Minimize E|X - a|: Median vs Mean",
text:`Let $X$ have pdf $f(x) = 2x$ for $0 \\leq x \\leq 1$.
<p>(a) Find $E(X)$ and the median $m$ of $X$.</p>
<p>(b) Which minimizes $E(X - a)^2$? Which minimizes $E|X - a|$?</p>`,
tags:["median","mean","optimization"],trap:true,
sol:`(a) $E(X) = \\int_0^1 2x^2\\,dx = 2/3$.

Median: solve $F(m) = 0.5$. $F(x) = \\int_0^x 2t\\,dt = x^2$.
$$m^2 = 0.5 \\implies m = 1/\\sqrt{2} \\approx 0.7071$$

(b) The mean minimizes $E(X-a)^2$ (mean squared error).

The median minimizes $E|X - a|$ (mean absolute error).

TRAP: these are different optimizers! The mean ($2/3 \\approx 0.667$) and median ($1/\\sqrt{2} \\approx 0.707$) differ here because the distribution is skewed.

Why: $E(X-a)^2$ penalizes large deviations quadratically, making it sensitive to the tail, pulling toward the mean. $E|X-a|$ penalizes proportionally, making it robust to extremes, centering at the median.

For symmetric distributions ($f$ symmetric about $\\mu$), the mean equals the median, so both criteria agree. For skewed distributions like this one, they disagree, and the choice of loss function matters.`},

{ch:"ch5",chLabel:"Ch 5: Continuous Distributions",id:93,title:"The 68-95-99.7 Rule",
text:`Adult heights are $N(170, 64)$ cm.
<p>(a) Without tables, find the range that contains approximately 95% of heights.</p>
<p>(b) A height of 186 cm is how many standard deviations above the mean? What percentile is this approximately?</p>
<p>(c) What is $P(154 < X < 178)$ approximately?</p>`,
tags:["Normal","empirical rule","68-95-99.7"],
sol:`$\\mu = 170$, $\\sigma = \\sqrt{64} = 8$.

(a) The 95% interval is $\\mu \\pm 2\\sigma = 170 \\pm 16 = [154, 186]$ cm.

(By the 68-95-99.7 rule: 68% within $1\\sigma$, 95% within $2\\sigma$, 99.7% within $3\\sigma$.)

(b) $z = (186 - 170)/8 = 2$. This is 2 standard deviations above the mean.

Since 95% of the distribution is within $\\pm 2\\sigma$, the remaining 5% is split equally in both tails: 2.5% above $z = 2$. So 186 cm is approximately the 97.5th percentile.

(c) $154 = \\mu - 2\\sigma$ and $178 = \\mu + \\sigma$.

$P(\\mu - 2\\sigma < X < \\mu + \\sigma) = P(-2 < Z < 1)$

Break it up: $P(Z < 1) - P(Z < -2)$.

$P(Z < 1) \\approx 0.5 + 0.68/2 = 0.84$

$P(Z < -2) \\approx 0.025$ (lower 2.5%)

$$P \\approx 0.84 - 0.025 = 0.815$$

(Exact: $\\Phi(1) - \\Phi(-2) = 0.8413 - 0.0228 = 0.8185$.)

The 68-95-99.7 rule gives fast approximate answers without tables. It is precise enough for estimation and sanity-checking.`},

// ===================== PHASE 3: FINAL GAP FILL =====================

// ===== CLT GAPS =====
{ch:"ch5",chLabel:"Ch 5: Continuous Distributions",id:94,title:"CLT on Sample Mean (Non-Binomial)",
text:`The lifetime of a battery is Exponential with mean 100 hours ($\\lambda = 0.01$). A device uses 36 batteries sequentially. Find the probability that the total lifetime of all 36 batteries exceeds 3,800 hours. Also find $P(\\bar{X} > 110)$.`,
tags:["CLT","sample mean","Exponential"],
sol:`Each $X_i \\sim \\text{Exp}(0.01)$: $E(X_i) = 100$, $\\text{Var}(X_i) = 1/\\lambda^2 = 10{,}000$.

Part 1 (sum): $S = X_1 + \\cdots + X_{36}$. By CLT:
$$E(S) = 36(100) = 3600, \\quad \\text{Var}(S) = 36(10{,}000) = 360{,}000$$

$$P(S > 3800) = P\\left(Z > \\frac{3800 - 3600}{\\sqrt{360{,}000}}\\right) = P\\left(Z > \\frac{200}{600}\\right) = P(Z > 0.333)$$
$$= 1 - \\Phi(0.333) \\approx 1 - 0.6304 = 0.3696$$

No continuity correction needed (continuous RV).

Part 2 (mean): $\\bar{X} = S/36$.
$$E(\\bar{X}) = 100, \\quad \\text{Var}(\\bar{X}) = 10{,}000/36 = 277.78$$

$$P(\\bar{X} > 110) = P\\left(Z > \\frac{110 - 100}{\\sqrt{277.78}}\\right) = P\\left(Z > \\frac{10}{16.67}\\right) = P(Z > 0.600) \\approx 0.2743$$

Key: CLT applies to ANY distribution with finite mean and variance, not just Binomial. For $S$: standardize with $n\\mu$ and $\\sqrt{n}\\sigma$. For $\\bar{X}$: standardize with $\\mu$ and $\\sigma/\\sqrt{n}$.`},

{ch:"ch5",chLabel:"Ch 5: Continuous Distributions",id:95,title:"Continuity Correction: All Direction Cases",
text:`Let $X \\sim \\text{Bin}(200, 0.3)$. Using the Normal approximation, compute each of the following. State the continuity correction boundary in each case.
<p>(a) $P(X \\leq 55)$</p>
<p>(b) $P(X \\geq 65)$</p>
<p>(c) $P(X = 60)$</p>
<p>(d) $P(55 \\leq X \\leq 65)$</p>
<p>(e) $P(X > 55)$</p>`,
tags:["CLT","continuity correction","all cases"],trap:true,
sol:`$E(X) = 60$, $\\text{Var}(X) = 200(0.3)(0.7) = 42$, $\\sigma = \\sqrt{42} \\approx 6.48$.

The rule: expand the discrete range by 0.5 in each direction to "include" the boundary values.

(a) $P(X \\leq 55) \\to P(Y \\leq 55.5) = P(Z \\leq (55.5-60)/6.48) = P(Z \\leq -0.694) \\approx 0.244$

(b) $P(X \\geq 65) \\to P(Y \\geq 64.5) = P(Z \\geq (64.5-60)/6.48) = P(Z \\geq 0.694) \\approx 0.244$

(c) $P(X = 60) \\to P(59.5 \\leq Y \\leq 60.5) = P(-0.077 \\leq Z \\leq 0.077) \\approx 0.061$

(d) $P(55 \\leq X \\leq 65) \\to P(54.5 \\leq Y \\leq 65.5) = P(-0.849 \\leq Z \\leq 0.849) \\approx 0.604$

(e) TRAP: $P(X > 55) \\neq P(X \\geq 55)$ for discrete. $P(X > 55) = P(X \\geq 56)$, so:
$$P(X > 55) \\to P(Y \\geq 55.5) = P(Z \\geq -0.694) \\approx 0.756$$

Mnemonic: always convert to $\\leq$ or $\\geq$ first (so $> 55$ becomes $\\geq 56$), THEN slide 0.5 outward from the boundary to include it.`},

{ch:"ch5",chLabel:"Ch 5: Continuous Distributions",id:96,title:"Normal Approximation to Poisson",
text:`Calls arrive at a call center as a Poisson process with rate 144 per hour. Find $P(X \\leq 120)$ where $X$ is the number of calls in an hour, and $P(130 \\leq X \\leq 160)$.`,
tags:["CLT","Poisson","Normal approximation"],
sol:`$X \\sim \\text{Poi}(144)$. Since $\\mu = 144$ is large, use Normal approximation: $X \\approx N(144, 144)$, so $\\sigma = 12$.

$P(X \\leq 120)$: with continuity correction (Poisson is discrete):
$$P(X \\leq 120) \\approx P\\left(Z \\leq \\frac{120.5 - 144}{12}\\right) = P(Z \\leq -1.958) \\approx 0.0251$$

$P(130 \\leq X \\leq 160)$:
$$P(129.5 \\leq Y \\leq 160.5) = P\\left(\\frac{129.5 - 144}{12} \\leq Z \\leq \\frac{160.5 - 144}{12}\\right)$$
$$= P(-1.208 \\leq Z \\leq 1.375) = \\Phi(1.375) - \\Phi(-1.208) \\approx 0.9155 - 0.1135 = 0.802$$

Why this works: A $\\text{Poi}(\\mu)$ is the sum of $\\mu$ independent Poi(1) variables (reproductive property), so CLT applies directly when $\\mu$ is large. Rule of thumb: $\\mu \\geq 10$ is usually enough for the Normal approximation.`},

// ===== OTHER FLAGGED GAPS =====
{ch:"ch4",chLabel:"Ch 4: Multivariate Distributions",id:97,title:"Conditional PMF and Conditional Expectation from Joint Table",
text:`$(X, Y)$ have joint PMF:

| | $Y=0$ | $Y=1$ | $Y=2$ |
|---|---|---|---|
| $X=0$ | 0.05 | 0.10 | 0.05 |
| $X=1$ | 0.10 | 0.25 | 0.15 |
| $X=2$ | 0.05 | 0.10 | 0.15 |

<p>(a) Find $f_{Y|X}(y \\mid X = 1)$ for all $y$.</p>
<p>(b) Find $E(Y \\mid X = 1)$ and $\\text{Var}(Y \\mid X = 1)$.</p>
<p>(c) Verify Adam's law: $E[E(Y|X)] = E(Y)$.</p>`,
tags:["conditional PMF","conditional expectation","Adam's law"],
sol:`First, marginals: $f_X(0) = 0.20$, $f_X(1) = 0.50$, $f_X(2) = 0.30$.

(a) Conditional PMF = joint / marginal:

$$f_{Y|X}(y \\mid X=1) = \\frac{f(1, y)}{f_X(1)}$$

<p class="step">$f(0 \\mid 1) = 0.10/0.50 = 0.20$</p>
<p class="step">$f(1 \\mid 1) = 0.25/0.50 = 0.50$</p>
<p class="step">$f(2 \\mid 1) = 0.15/0.50 = 0.30$</p>

Check: $0.20 + 0.50 + 0.30 = 1$. &#10003;

(b) $E(Y \\mid X=1) = 0(0.20) + 1(0.50) + 2(0.30) = 1.10$

$E(Y^2 \\mid X=1) = 0(0.20) + 1(0.50) + 4(0.30) = 1.70$

$\\text{Var}(Y \\mid X=1) = 1.70 - 1.10^2 = 1.70 - 1.21 = 0.49$

(c) $E(Y|X=0) = 0(0.25) + 1(0.50) + 2(0.25) = 1.00$
$E(Y|X=2) = 0(1/6) + 1(1/3) + 2(1/2) = 4/3$

$E[E(Y|X)] = 1.00(0.20) + 1.10(0.50) + (4/3)(0.30) = 0.20 + 0.55 + 0.40 = 1.15$

$E(Y) = 0(0.20) + 1(0.45) + 2(0.35) = 1.15$. &#10003; Adam's law holds.`},

{ch:"ch3",chLabel:"Ch 3: Discrete Distributions",id:98,title:"Discrete Uniform Distribution",
text:`A fair die is rolled. Let $X$ be the result.
<p>(a) Write the PMF, CDF, and find $E(X)$, $\\text{Var}(X)$.</p>
<p>(b) Generalize: for $X \\sim \\text{DU}(a, b)$ (integers $a$ to $b$), derive $E(X)$ and $\\text{Var}(X)$.</p>
<p>(c) $Y = 2X - 1$. Find $E(Y)$ and $\\text{Var}(Y)$.</p>`,
tags:["Discrete Uniform","named distribution"],
sol:`(a) $X \\sim \\text{DU}(1, 6)$: $P(X = x) = 1/6$ for $x = 1, 2, \\ldots, 6$.

CDF: $F(x) = x/6$ for $x = 1, \\ldots, 6$ (step function with jumps of $1/6$).

$E(X) = (1+2+3+4+5+6)/6 = 21/6 = 3.5$

$E(X^2) = (1+4+9+16+25+36)/6 = 91/6$

$\\text{Var}(X) = 91/6 - (7/2)^2 = 91/6 - 49/4 = (182 - 147)/12 = 35/12 \\approx 2.917$

(b) For $X \\sim \\text{DU}(a, b)$ with $n = b - a + 1$ values:

$$E(X) = \\frac{a + b}{2} \\qquad \\text{Var}(X) = \\frac{n^2 - 1}{12} = \\frac{(b-a+1)^2 - 1}{12}$$

For the die: $E = 7/2$, $\\text{Var} = (36-1)/12 = 35/12$. &#10003;

(c) $E(Y) = 2(3.5) - 1 = 6$. $\\text{Var}(Y) = 4 \\cdot 35/12 = 35/3 \\approx 11.67$.`},

{ch:"ch3",chLabel:"Ch 3: Discrete Distributions",id:99,title:"PMF Pipeline: Table to Everything",
text:`A random variable $X$ has the following probability distribution:

| $x$ | $-2$ | $-1$ | $0$ | $1$ | $3$ |
|---|---|---|---|---|---|
| $P(X=x)$ | $0.1$ | $0.2$ | $c$ | $0.3$ | $0.1$ |

<p>(a) Find $c$.</p>
<p>(b) Find $E(X)$, $E(X^2)$, $\\text{Var}(X)$, $\\text{SD}(X)$.</p>
<p>(c) Find $E(3X^2 - 2X + 1)$.</p>
<p>(d) Find $P(|X| \\geq 1)$.</p>`,
tags:["PMF","expected value","variance","pipeline"],
sol:`(a) $\\sum P = 0.1 + 0.2 + c + 0.3 + 0.1 = 1 \\implies c = 0.3$.

(b) $E(X) = (-2)(0.1) + (-1)(0.2) + 0(0.3) + 1(0.3) + 3(0.1) = -0.2 - 0.2 + 0 + 0.3 + 0.3 = 0.2$

$E(X^2) = 4(0.1) + 1(0.2) + 0(0.3) + 1(0.3) + 9(0.1) = 0.4 + 0.2 + 0 + 0.3 + 0.9 = 1.8$

$\\text{Var}(X) = E(X^2) - [E(X)]^2 = 1.8 - 0.04 = 1.76$

$\\text{SD}(X) = \\sqrt{1.76} \\approx 1.327$

(c) By linearity: $E(3X^2 - 2X + 1) = 3E(X^2) - 2E(X) + 1 = 3(1.8) - 2(0.2) + 1 = 5.4 - 0.4 + 1 = 6.0$

(d) $P(|X| \\geq 1) = 1 - P(X = 0) = 1 - 0.3 = 0.7$

Alternatively: $P(X = -2) + P(X = -1) + P(X = 1) + P(X = 3) = 0.1 + 0.2 + 0.3 + 0.1 = 0.7$. &#10003;`},

{ch:"ch3",chLabel:"Ch 3: Discrete Distributions",id:100,title:"Poisson Approximation to Binomial",
text:`A batch of 500 items has a 0.4% defect rate (independently). Let $X$ = number of defectives.
<p>(a) What is the exact distribution of $X$?</p>
<p>(b) Justify and apply the Poisson approximation. Find $P(X = 0)$, $P(X \\geq 3)$.</p>
<p>(c) An item is "rare defective" (prob $10^{-5}$) in a batch of $10^5$. Find $P(X = 0)$.</p>`,
tags:["Poisson approximation","Binomial","rare events"],
sol:`(a) $X \\sim \\text{Bin}(500, 0.004)$.

(b) Conditions: $n = 500$ is large, $p = 0.004$ is small, $\\mu = np = 2$ is moderate. So $X \\approx \\text{Poi}(2)$.

$P(X = 0) \\approx e^{-2} \\approx 0.1353$

$P(X \\geq 3) = 1 - P(X \\leq 2) = 1 - e^{-2}(1 + 2 + 2) = 1 - 5e^{-2} \\approx 1 - 0.6767 = 0.3233$

(c) $n = 10^5$, $p = 10^{-5}$, $\\mu = np = 1$. $X \\approx \\text{Poi}(1)$.

$P(X = 0) \\approx e^{-1} \\approx 0.3679$.

Rule of thumb for when to use Poisson approximation: $n \\geq 100$, $p \\leq 0.01$, $np \\leq 20$. The approximation is exact in the limit $n \\to \\infty$, $p \\to 0$, $np \\to \\mu$.`},

{ch:"ch5",chLabel:"Ch 5: Continuous Distributions",id:101,title:"CLT: Difference of Two Independent Sample Means",
text:`Machine A produces bolts with mean length 5.00 cm ($\\sigma_A = 0.04$). Machine B produces bolts with mean length 5.02 cm ($\\sigma_B = 0.06$). Samples of $n_A = 40$ and $n_B = 50$ are taken independently. Find $P(\\bar{X}_A > \\bar{X}_B)$.`,
tags:["CLT","difference of means","Normal"],
sol:`Let $D = \\bar{X}_A - \\bar{X}_B$. By CLT, both sample means are approximately Normal, and their difference is Normal:

$$E(D) = 5.00 - 5.02 = -0.02$$

$$\\text{Var}(D) = \\frac{\\sigma_A^2}{n_A} + \\frac{\\sigma_B^2}{n_B} = \\frac{0.0016}{40} + \\frac{0.0036}{50} = 0.00004 + 0.000072 = 0.000112$$

$$\\text{SD}(D) = \\sqrt{0.000112} \\approx 0.01058$$

$$P(\\bar{X}_A > \\bar{X}_B) = P(D > 0) = P\\left(Z > \\frac{0 - (-0.02)}{0.01058}\\right) = P(Z > 1.89)$$

$$= 1 - \\Phi(1.89) \\approx 1 - 0.9706 = 0.0294$$

There is about a 3% chance Machine A's sample average exceeds Machine B's, even though A's true mean is smaller. This is because the sampling variability could produce a misleading comparison.

Key: variances ADD in the difference (just like Q32 and Q44), and no continuity correction is needed since sample means are continuous.`},

];

const chapters = [
  {key:"all",label:"All"},
  {key:"ch1",label:"Ch 1"},
  {key:"ch2",label:"Ch 2"},
  {key:"ch3",label:"Ch 3"},
  {key:"ch4",label:"Ch 4"},
  {key:"ch5",label:"Ch 5"},
  {key:"chx",label:"Cross-Topic"}
];

let activeTab = "all";
let openCards = new Set();
let doneCards = new Set();

function render() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = chapters.map(c =>
    `<button class="tab ${activeTab===c.key?'active':''}" onclick="setTab('${c.key}')">${c.label}</button>`
  ).join("");

  const chOrder = {ch1:1,ch2:2,ch3:3,ch4:4,ch5:5,chx:6};
  const filtered = (activeTab === "all" ? [...Q] : Q.filter(q => q.ch === activeTab))
    .sort((a,b) => (chOrder[a.ch]-chOrder[b.ch]) || (a.id-b.id));
  let html = "";
  let lastCh = "";

  for (const q of filtered) {
    if (q.chLabel !== lastCh) {
      lastCh = q.chLabel;
      html += `<div class="${q.ch}"><div class="chapter-label">${q.chLabel}</div></div>`;
    }
    const isOpen = openCards.has(q.id);
    const isDone = doneCards.has(q.id);
    const srcTag = q.id >= 65 ? '<span class="src-tag">' + (q.id <= 78 ? 'TEXTBOOK' : 'TEXTBOOK+') + '</span>' : '';
    html += `<div class="card ${q.ch} ${isOpen?'open':''} ${isDone?'done':''}" id="card-${q.id}">
      <div class="card-head" onclick="toggle(${q.id})">
        <div class="q-num">Q${q.id}</div>
        <div class="q-body">
          <div class="q-title">${q.title} ${srcTag}</div>
          <div class="q-text">${q.text}</div>
          <div class="tags">${q.tags.map(t => `<span class="tag${q.trap?' trap':''}">${t}</span>`).join("")}${q.trap?'<span class="tag trap">trap</span>':''}</div>
        </div>
        <div class="chevron">&#9654;</div>
      </div>
      <div class="solution">
        <div class="sol-label">Solution</div>
        <div class="sol-text">${q.sol}</div>
        <button class="mark-btn ${isDone?'marked':''}" onclick="markDone(${q.id},event)">
          ${isDone ? '&#10003; Completed' : 'Mark complete'}
        </button>
      </div>
    </div>`;
  }

  document.getElementById("main").innerHTML = html;
  updateProgress();
  renderMath();
}

function renderMath() {
  if (typeof renderMathInElement !== "function") return; // KaTeX not ready / blocked
  renderMathInElement(document.getElementById("main"), {
    delimiters: [
      {left: "$$", right: "$$", display: true},
      {left: "$", right: "$", display: false}
    ],
    throwOnError: false
  });
}

function setTab(key) {
  activeTab = key;
  render();
}

function toggle(id) {
  if (openCards.has(id)) openCards.delete(id);
  else openCards.add(id);
  render();
}

function markDone(id, e) {
  e.stopPropagation();
  if (doneCards.has(id)) doneCards.delete(id);
  else doneCards.add(id);
  render();
}

function updateProgress() {
  const total = Q.length;
  const done = doneCards.size;
  document.getElementById("prog-label").textContent = `${done} / ${total}`;
  document.getElementById("prog-fill").style.width = `${(done/total)*100}%`;
}

function loadFallbackKatex(done) {
  var css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = "https://unpkg.com/katex@0.16.11/dist/katex.min.css";
  document.head.appendChild(css);
  var s1 = document.createElement("script");
  s1.src = "https://unpkg.com/katex@0.16.11/dist/katex.min.js";
  s1.onload = function () {
    var s2 = document.createElement("script");
    s2.src = "https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js";
    s2.onload = done;
    document.head.appendChild(s2);
  };
  document.head.appendChild(s1);
}

function boot() {
  render();                 // questions render no matter what
  renderMath();             // typeset now if KaTeX already loaded
  if (typeof renderMathInElement === "function") return;
  var tries = 0;
  (function wait() {
    if (typeof renderMathInElement === "function") { renderMath(); return; }
    if (tries++ < 20) { setTimeout(wait, 100); return; }   // ~2s grace for primary CDN
    loadFallbackKatex(renderMath);                          // else pull from unpkg
  })();
}

if (document.readyState !== "loading") boot();
else window.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
